<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPv6 SRA Dataset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tud-logo.svg') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="nav-title" href="/">IPv6 Subnet-Router Anycast (SRA) Dataset</a>
        <button class="nav-toggle" type="button" aria-controls="primary-nav">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>
        <nav class="navbar">
            <ul class="nav-links" id="primary-nav">
                <li><a href="/measurement-results">IPv6 Router Addresses</a></li>
                <li><a href="/routingloops">Routing Loops</a></li>
                <li><a href="https://doi.org/10.1145/3768997" target="_blank" rel="noopener">Paper</a></li>
                <li><a href="/artifacts">Tooling</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
    <section class="footer-tiles">
    <div class="tile-row tile-row">
            <div class="tile logo-tile">
                <h3>Powered by</h3>
                <div class="logo-grid">
                    <a href="https://tu-dresden.de/ing/informatik/sya/netd" target="_blank" rel="noopener">
                        <img src="{{ url_for('static', filename='img/logos/tud-logo-long.svg') }}" alt="TU Dresden logo">
                    </a>
                    <a href="https://inet.haw-hamburg.de" target="_blank" rel="noopener">
                        <img src="{{ url_for('static', filename='img/logos/haw-logo.png') }}" alt="HAW Hamburg logo">
                    </a>
                    <a href="https://www.bmftr.bund.de" target="_blank" rel="noopener">
                        <img src="{{ url_for('static', filename='img/logos/bmftr-funding.png') }}" alt="BMFTR funded by logo">
                    </a>
                </div>
                <h3>External data providers</h3>
                <div class="logo-grid">
                    <a href="https://net.in.tum.de" target="_blank" rel="noopener">
                    <img class="logo-small" src="{{ url_for('static', filename='img/logos/tum-logo.png') }}" alt="TU Munich logo">
                    </a>
                    <a href="https://www.routeviews.org" target="_blank" rel="noopener">
                        <img class="logo-medium" src="{{ url_for('static', filename='img/logos/external/routeviews.svg') }}" alt="Routeviews logo">
                    </a>
                    <a href="https://atlas.ripe.net" target="_blank" rel="noopener">
                        <img class="logo-small" src="{{ url_for('static', filename='img/logos/external/ripeatlas.svg') }}" alt="RIPE Atlas logo">
                    </a>
                    <a href="https://www.caida.org" target="_blank" rel="noopener">
                        <img class="logo-medium" src="{{ url_for('static', filename='img/logos/external/caida.png') }}" alt="CAIDA logo">
                    </a>
                    <a href="https://www.maxmind.com" target="_blank" rel="noopener">
                        <img class="logo-small" src="{{ url_for('static', filename='img/logos/external/maxmind-logo.svg') }}" alt="Maxmind logo">
                    </a>
                    <a href="https://ipinfo.io" target="_blank" rel="noopener">
                        <img class="logo-small" src="{{ url_for('static', filename='img/logos/external/ipinfo.svg') }}" alt="IPinfo logo">
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>


<footer class="site-footer">
    <p>
        <a href="{{ url_for('legal_notice') }}">Legal Notice</a> |
        <a href="{{ url_for('legal_notice') }}#ck_datenschutz">Privacy</a> |
        <a href="{{ url_for('legal_notice') }}#accessibility">Accessibility</a>
    </p>
</footer>

<script>
    const navToggle = document.querySelector('.nav-toggle');
    const header = document.querySelector('.site-header');
    const navBar = document.querySelector('.navbar');
    const navLinksList = document.querySelector('.nav-links');
    const navLinks = document.querySelectorAll('.nav-links a');
    const navBreakpoint = 900;

    if (navToggle && header && navBar && navLinksList) {
        const updateNavCollapse = () => {
            const previousDisplay = navLinksList.style.display;
            const previousVisibility = navLinksList.style.visibility;
            const previousPosition = navLinksList.style.position;
            const previousPointerEvents = navLinksList.style.pointerEvents;

            navLinksList.style.display = 'flex';
            navLinksList.style.visibility = 'hidden';
            navLinksList.style.position = 'absolute';
            navLinksList.style.pointerEvents = 'none';

            const shouldCollapse = window.innerWidth < navBreakpoint;

            navLinksList.style.display = previousDisplay;
            navLinksList.style.visibility = previousVisibility;
            navLinksList.style.position = previousPosition;
            navLinksList.style.pointerEvents = previousPointerEvents;

            header.classList.toggle('nav-collapsed', shouldCollapse);
            if (!shouldCollapse) {
                header.classList.remove('nav-open');
                navToggle.setAttribute('aria-expanded', 'false');
            }
        };

        navToggle.addEventListener('click', () => {
            const isOpen = header.classList.toggle('nav-open');
            navToggle.setAttribute('aria-expanded', String(isOpen));
        });

        navLinks.forEach((link) => {
            link.addEventListener('click', () => {
                if (header.classList.contains('nav-open')) {
                    header.classList.remove('nav-open');
                    navToggle.setAttribute('aria-expanded', 'false');
                }
            });
        });

        updateNavCollapse();
        window.addEventListener('resize', updateNavCollapse);

        if ('ResizeObserver' in window) {
            const navObserver = new ResizeObserver(updateNavCollapse);
            navObserver.observe(navBar);
        }
    }
</script>
</body>
</html>
